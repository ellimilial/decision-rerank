[project]
name = "decision-rerank"
version = "0.1.0"
description = "Reproducible evaluation of decision models as biomedical rerankers"
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb==1.5.6",
    "bm25s==0.3.13",
    "PyStemmer==3.1.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "tokenizers==0.22.2",
]

[dependency-groups]
# Colab provides CUDA-enabled torch. Retain and profile that installation rather
# than replacing it with a platform-dependent PyTorch distribution here.
models = [
    "transformers==5.10.2",
    "peft==0.21.2",
    "accelerate==1.15.0",
]

notebooks = [
    "jupyterlab>=4.6.4",
]
cpu = [
    "torch==2.11.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.1"
default-groups = []
